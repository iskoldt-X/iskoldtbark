[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iskoldtbark"
version = "0.2.2"
description = "A secure, official-compliant Python client for the Bark push notification service."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "iskold", email = "swoop-eel-popper@duck.com" }
]
keywords = ["bark", "push", "notification", "ios", "encryption", "aes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "requests>=2.25.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/iskoldt-X/iskoldtbark"
Repository = "https://github.com/iskoldt-X/iskoldtbark"
Issues = "https://github.com/iskoldt-X/iskoldtbark/issues"

[project.scripts]
iskoldtbark = "iskoldtbark.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iskoldtbark"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
